<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>

    <!-- css -->
    <link rel="stylesheet" href="assets/css/reset.css">
    <link rel="stylesheet" href="assets/css/fonts.css">
    <link rel="stylesheet" href="assets/css/appleplayer.css">

    <!-- js -->
    <script src="assets/js/appleplayer.js"></script>
</head>

<body>

    <header id="player-header">
        <div class="container">
            <div class="row">
                <div class="song-info">
                    <h2 id="player-title">REBEL HEART</h2>
                    <p id="player-artist">IVE(아이브)</p>
                </div>
                <div class="icons">
                    <span class="menu">⋮</span>
                    <span class="drop"><img src="assets/img2/down.png" alt="드롭다운"></span>
                </div>
            </div>
        </div>
    </header>
    <!-- header -->

    <section class="musicarea">
        <article class="album">
            <div class="container">
                <div class="row">
                    <div class="albumarea">

                        <img id="player-img" src="assets/img/rebel_heart01.jpg" alt="앨범 이미지">

                        <div class="like-section">
                            <button id="likeBtn" class="liked">♡</button>
                            <span class="like-count">0</span>
                        </div>
                        <!-- 관리자 좋아요 초기화 버튼 -->
                        <button id="resetLikesBtn" style="display: none;">초기화</button>
                    </div>
                </div>
            </div>
        </article>

        <article class="lyrics">
            <div class="container">
                <div class="row">
                    <div class="song-lyrics">
                        <p>가사가 여기에 들어갑니다.</p>
                    </div>
                </div>
            </div>
        </article>

        <article class="playermusic">
            <div class="container">
                <div class="row">
                    <div class="playerarea">
                        <div class="progress-container">
                            <span id="currentTimeDisplay">0:00</span>
                            <input type="range" id="progress-bar" value="0" min="0" max="100" step="0.1">
                            <span id="durationDisplay">0:00</span>
                        </div>
        
                        <div class="player-controls">
                            <button id="repeatBtn"><img src="assets/img2/retry.png" alt="반복"></button>
                            <button id="prevBtn"><img src="assets/img2/before.png" alt="이전"></button>
        
                            <!-- 중앙에 위치할 재생/멈춤 버튼 -->
                            <div class="play-container">
                                <button id="playPauseBtn">
                                    <img src="assets/img2/stopbtn.png" id="playPauseImg" class="playing" alt="멈춤">
                                </button>
                            </div>
        
                            <button id="nextBtn"><img src="assets/img2/next.png" alt="다음"></button>
                            <button id="shuffleBtn"><img src="assets/img2/shuffle.png" alt="셔플"></button>
                        </div>
        
                        <audio id="audioPlayer">
                            <source src="assets/audio/rebelheart.m4a" type="audio/mpeg">
                        </audio>
                    </div>
                </div>
            </div>
        </article>
        </div>
    </section>
